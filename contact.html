<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Lexiconic Interiors</title>
<meta name="description" content="Get in touch with Lexiconic Interiors, a Wilmington, NC interior design studio. Tell us what you're dreaming up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="index.html"><img src="images/lexiconic-logo.png" alt="Lexiconic Interiors, home" width="180" height="65"></a>
    <nav aria-label="Main">
      <ul>
        <li><a href="featured-projects.html">Featured Projects</a></li>
        <li><a href="our-story.html">Our Story</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
        <li class="insta"><a href="https://www.instagram.com/lexiconicinteriors/" target="_blank" rel="noopener"><img src="instagram-gold.png" alt="" width="24" height="24"><span class="visually-hidden">Instagram (opens in a new tab)</span></a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main" tabindex="-1">
  <div class="split contact">

    <figure>
      <img src="images/contact-neon.jpg" width="900" height="1411" alt="A pink neon sign reading “All you need is love” on a glass console table, beside a silver pouf and a leafy plant">
    </figure>

    <div>
      <h1>Let’s Build Your Story</h1>
      <p class="lede">We’d love to hear what you’re dreaming up</p>

      <!--
        This form opens the visitor's email app with their message ready to send
        to info@lexiconicinteriors.com (see js/main.js). To change the address,
        update it here and in js/main.js.
      -->
      <form id="contact-form" action="mailto:info@lexiconicinteriors.com" method="post" enctype="text/plain">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button class="button" type="submit">Submit</button>
        <p id="form-status" class="form-status" role="status"></p>
      </form>
    </div>

  </div>
</main>

<footer class="site-footer">
  <p>&copy; 2026 Lexiconic Interiors</p>
</footer>

<script src="js/main.js" defer></script>
</body>
</html>
